{% extends 'base.html' %}
{% block conteudo %}
<h1>Lista de Livros</h1>

<!-- Botão de cadastro que faltava -->
<a href="{% url 'novo_livro' %}">Cadastrar Novo Livro</a>

<ul>
    {% for livro in livros %}
        <li>{{ livro.titulo }} - {{ livro.autor }} ({{ livro.ano }})</li>
    {% empty %}
        <li>Nenhum livro cadastrado.</li>
    {% endfor %}
</ul>

<br>
<!-- Link para voltar ao Menu Principal -->
<a href="{% url 'index' %}">Voltar para o Menu Principal</a>
{% endblock %}
